
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday 🎂</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
    background: #02020d;
}

/* =========================
   MAIN PAGE
========================= */

#homePage {
    width: 100%;
    height: 100vh;
    position: relative;
    overflow: hidden;
    background:
        radial-gradient(circle at 50% 40%, #24105a 0%, #09001c 35%, #010108 75%);
}

/* Stars */

.stars,
.stars2,
.stars3 {
    position: absolute;
    inset: 0;
    pointer-events: none;
}

.stars {
    background-image:
        radial-gradient(2px 2px at 10% 20%, white, transparent),
        radial-gradient(2px 2px at 20% 80%, white, transparent),
        radial-gradient(1px 1px at 30% 40%, white, transparent),
        radial-gradient(2px 2px at 40% 15%, white, transparent),
        radial-gradient(1px 1px at 50% 70%, white, transparent),
        radial-gradient(2px 2px at 60% 30%, white, transparent),
        radial-gradient(1px 1px at 70% 80%, white, transparent),
        radial-gradient(2px 2px at 80% 20%, white, transparent),
        radial-gradient(1px 1px at 90% 60%, white, transparent);
    animation: starMove 8s linear infinite;
}

.stars2 {
    background-image:
        radial-gradient(2px 2px at 15% 55%, #ff66ff, transparent),
        radial-gradient(2px 2px at 35% 90%, #66ffff, transparent),
        radial-gradient(2px 2px at 55% 10%, #ffff66, transparent),
        radial-gradient(2px 2px at 75% 50%, #ff66ff, transparent),
        radial-gradient(2px 2px at 95% 30%, #66ffff, transparent);
    animation: starMove 12s linear infinite reverse;
}

.stars3 {
    background-image:
        radial-gradient(1px 1px at 25% 25%, #fff, transparent),
        radial-gradient(1px 1px at 45% 60%, #fff, transparent),
        radial-gradient(1px 1px at 65% 40%, #fff, transparent),
        radial-gradient(1px 1px at 85% 75%, #fff, transparent);
    animation: twinkle 2s infinite alternate;
}

@keyframes starMove {
    from {
        transform: translateY(0);
    }
    to {
        transform: translateY(-40px);
    }
}

@keyframes twinkle {
    from {
        opacity: .25;
    }
    to {
        opacity: 1;
    }
}

/* Main content */

.content {
    position: relative;
    z-index: 10;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
}

/* Birthday title */

.title {
    font-size: clamp(42px, 9vw, 110px);
    font-weight: 900;
    letter-spacing: 5px;
    text-transform: uppercase;

    background: linear-gradient(
        90deg,
        #ff00cc,
        #ff66ff,
        #ffffff,
        #66ffff,
        #00ccff,
        #ff00cc
    );

    background-size: 300% 300%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;

    animation:
        gradientMove 5s linear infinite,
        titleGlow 2s ease-in-out infinite alternate;

    filter: drop-shadow(0 0 20px #ff00cc);
}

@keyframes gradientMove {
    0% {
        background-position: 0% 50%;
    }

    50% {
        background-position: 100% 50%;
    }

    100% {
        background-position: 0% 50%;
    }
}

@keyframes titleGlow {
    from {
        filter:
            drop-shadow(0 0 10px #ff00cc)
            drop-shadow(0 0 20px #ff00cc);
    }

    to {
        filter:
            drop-shadow(0 0 25px #00ffff)
            drop-shadow(0 0 50px #ff00cc);
    }
}

/* Photo */

.main-photo {
    width: min(270px, 55vw);
    height: min(270px, 55vw);

    margin: 20px 0;

    border-radius: 50%;
    padding: 7px;

    background: linear-gradient(
        45deg,
        #ff00cc,
        #00ffff,
        #ffff00,
        #ff00cc
    );

    background-size: 400% 400%;

    animation:
        photoBorder 4s linear infinite,
        photoFloat 3s ease-in-out infinite;

    box-shadow:
        0 0 20px #ff00cc,
        0 0 40px #00ffff,
        0 0 80px #ff00cc;
}

.main-photo img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
    border-radius: 50%;
    border: 5px solid #09001c;
}

@keyframes photoBorder {
    0% {
        background-position: 0% 50%;
    }

    50% {
        background-position: 100% 50%;
    }

    100% {
        background-position: 0% 50%;
    }
}

@keyframes photoFloat {
    0%, 100% {
        transform: translateY(0) scale(1);
    }

    50% {
        transform: translateY(-10px) scale(1.03);
    }
}

/* Name */

.name {
    font-size: clamp(24px, 5vw, 50px);
    color: white;
    font-weight: bold;
    text-shadow:
        0 0 10px #ff00cc,
        0 0 25px #00ffff;
    margin-bottom: 25px;
}

/* Surprise button */

.surprise-btn {
    border: none;
    outline: none;
    cursor: pointer;

    padding: 17px 35px;
    border-radius: 50px;

    color: white;
    font-size: 18px;
    font-weight: bold;
    letter-spacing: 2px;

    background: linear-gradient(
        90deg,
        #ff0066,
        #ff00cc,
        #6600ff,
        #00ccff
    );

    background-size: 300% 300%;

    box-shadow:
        0 0 15px #ff00cc,
        0 0 30px #ff00cc,
        0 0 50px #6600ff;

    animation: buttonGradient 4s linear infinite,
               buttonPulse 1.5s infinite;

    transition: .3s;
}

.surprise-btn:hover {
    transform: scale(1.12);
    box-shadow:
        0 0 25px #00ffff,
        0 0 60px #ff00cc,
        0 0 100px #6600ff;
}

@keyframes buttonGradient {
    0% {
        background-position: 0% 50%;
    }

    50% {
        background-position: 100% 50%;
    }

    100% {
        background-position: 0% 50%;
    }
}

@keyframes buttonPulse {
    0%, 100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.05);
    }
}

/* =========================
   BALLOONS
========================= */

.balloon {
    position: absolute;
    width: 45px;
    height: 58px;
    border-radius: 50% 50% 45% 45%;
    z-index: 5;
    animation: balloonFloat 5s ease-in-out infinite;
}

.balloon::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 57px;
    width: 1px;
    height: 100px;
    background: rgba(255,255,255,.5);
}

.balloon::before {
    content: "";
    position: absolute;
    bottom: -5px;
    left: 18px;
    width: 10px;
    height: 10px;
    background: inherit;
    transform: rotate(45deg);
}

.b1 {
    left: 7%;
    top: 20%;
    background: #ff0066;
    box-shadow: 0 0 25px #ff0066;
}

.b2 {
    left: 15%;
    bottom: 15%;
    background: #00ccff;
    box-shadow: 0 0 25px #00ccff;
    animation-delay: 1s;
}

.b3 {
    right: 8%;
    top: 22%;
    background: #cc00ff;
    box-shadow: 0 0 25px #cc00ff;
    animation-delay: 2s;
}

.b4 {
    right: 15%;
    bottom: 18%;
    background: #00ff99;
    box-shadow: 0 0 25px #00ff99;
    animation-delay: 3s;
}

@keyframes balloonFloat {
    0%, 100% {
        transform: translateY(0) rotate(-5deg);
    }

    50% {
        transform: translateY(-35px) rotate(5deg);
    }
}

/* =========================
   SECOND PAGE
========================= */

#surprisePage {
    position: fixed;
    inset: 0;

    z-index: 100;

    display: none;
    opacity: 0;

    background:
        radial-gradient(circle at center, #32105e, #080014 55%, #000 100%);

    transition: opacity 1s ease;
}

#surprisePage.show {
    display: block;
    opacity: 1;
}

/* Second page title */

.memory-title {
    position: absolute;
    top: 35px;
    left: 0;
    width: 100%;

    text-align: center;

    font-size: clamp(30px, 6vw, 70px);
    font-weight: 900;
    letter-spacing: 5px;

    color: white;

    text-shadow:
        0 0 10px #ff00cc,
        0 0 25px #ff00cc,
        0 0 50px #00ffff;

    animation: memoryGlow 2s infinite alternate;

    z-index: 20;
}

@keyframes memoryGlow {
    from {
        transform: scale(1);
    }

    to {
        transform: scale(1.04);
    }
}

/* Photo frame area */

.gallery {
    position: absolute;

    left: 50%;
    top: 52%;

    width: min(900px, 95vw);
    height: min(500px, 65vh);

    transform: translate(-50%, -50%);
}

/* Cards */

.card {
    position: absolute;

    left: 50%;
    top: 50%;

    width: min(310px, 55vw);
    height: min(390px, 55vh);

    padding: 10px;

    background: linear-gradient(
        135deg,
        #ff00cc,
        #6600ff,
        #00ffff
    );

    border-radius: 20px;

    box-shadow:
        0 0 20px #ff00cc,
        0 0 40px #6600ff,
        0 0 70px rgba(0,255,255,.5);

    transition:
        transform .8s cubic-bezier(.2,.8,.2,1),
        opacity .8s,
        filter .8s;

    overflow: hidden;
}

.card-inner {
    width: 100%;
    height: 100%;

    padding: 8px;

    border-radius: 14px;

    background: #07000f;
}

.card img {
    width: 100%;
    height: 100%;

    object-fit: cover;

    border-radius: 10px;

    display: block;
}

/* Positions */

.card[data-position="0"] {
    transform:
        translate(-50%, -50%)
        translateX(0)
        scale(1.05)
        rotate(0deg);

    z-index: 10;
    opacity: 1;
    filter: none;
}

.card[data-position="1"] {
    transform:
        translate(-50%, -50%)
        translateX(250px)
        scale(.75)
        rotate(12deg);

    z-index: 7;
    opacity: .75;
    filter: brightness(.65);
}

.card[data-position="2"] {
    transform:
        translate(-50%, -50%)
        translateX(430px)
        scale(.58)
        rotate(20deg);

    z-index: 5;
    opacity: .45;
    filter: brightness(.45);
}

.card[data-position="3"] {
    transform:
        translate(-50%, -50%)
        translateX(-430px)
        scale(.58)
        rotate(-20deg);

    z-index: 5;
    opacity: .45;
    filter: brightness(.45);
}

.card[data-position="4"] {
    transform:
        translate(-50%, -50%)
        translateX(-250px)
        scale(.75)
        rotate(-12deg);

    z-index: 7;
    opacity: .75;
    filter: brightness(.65);
}

/* Next button */

.next-btn {
    position: absolute;

    right: 35px;
    top: 50%;

    transform: translateY(-50%);

    width: 65px;
    height: 65px;

    border-radius: 50%;
    border: 2px solid rgba(255,255,255,.7);

    background: rgba(255,255,255,.08);

    color: white;

    font-size: 35px;

    cursor: pointer;

    z-index: 30;

    box-shadow:
        0 0 15px #00ffff,
        inset 0 0 15px rgba(0,255,255,.2);

    transition: .3s;
}

.next-btn:hover {
    transform: translateY(-50%) scale(1.15);

    background: rgba(0,255,255,.2);

    box-shadow:
        0 0 30px #00ffff,
        0 0 60px #ff00cc;
}

/* =========================
   FIREWORK
========================= */

.firework {
    position: absolute;
    width: 5px;
    height: 5px;

    border-radius: 50%;

    background: white;

    box-shadow:
        0 0 10px white,
        0 0 20px #ff00cc,
        0 0 40px #00ffff;

    animation: explode 2s infinite;
}

.fw1 {
    left: 20%;
    top: 25%;
}

.fw2 {
    right: 20%;
    top: 30%;
    animation-delay: .8s;
}

.fw3 {
    left: 50%;
    top: 15%;
    animation-delay: 1.5s;
}

@keyframes explode {
    0% {
        transform: scale(.2);
        opacity: 0;
    }

    20% {
        transform: scale(1);
        opacity: 1;
    }

    60% {
        box-shadow:
            0 -70px 0 #ff00cc,
            50px -50px 0 #00ffff,
            70px 0 0 #ffff00,
            50px 50px 0 #ff0066,
            0 70px 0 #00ff99,
            -50px 50px 0 #6600ff,
            -70px 0 0 #ff00cc,
            -50px -50px 0 #00ffff;
        opacity: 1;
    }

    100% {
        transform: scale(1.3);
        opacity: 0;
    }
}

/* =========================
   MOBILE
========================= */

@media (max-width: 700px) {

    .title {
        letter-spacing: 2px;
    }

    .main-photo {
        width: 190px;
        height: 190px;
    }

    .name {
        font-size: 25px;
    }

    .surprise-btn {
        font-size: 15px;
        padding: 15px 24px;
    }

    .memory-title {
        top: 25px;
        font-size: 30px;
        letter-spacing: 2px;
    }

    .gallery {
        top: 53%;
        width: 100vw;
        height: 60vh;
    }

    .card {
        width: 210px;
        height: 290px;
    }

    .card[data-position="1"] {
        transform:
            translate(-50%, -50%)
            translateX(125px)
            scale(.70)
            rotate(10deg);
    }

    .card[data-position="2"] {
        transform:
            translate(-50%, -50%)
            translateX(190px)
            scale(.55)
            rotate(15deg);
    }

    .card[data-position="3"] {
        transform:
            translate(-50%, -50%)
            translateX(-190px)
            scale(.55)
            rotate(-15deg);
    }

    .card[data-position="4"] {
        transform:
            translate(-50%, -50%)
            translateX(-125px)
            scale(.70)
            rotate(-10deg);
    }

    .next-btn {
        right: 12px;
        width: 55px;
        height: 55px;
        font-size: 28px;
    }

    .balloon {
        width: 32px;
        height: 43px;
    }
}
</style>
</head>

<body>

<!-- =====================================================
     HOME PAGE
===================================================== -->

<div id="homePage">

    <div class="stars"></div>
    <div class="stars2"></div>
    <div class="stars3"></div>

    <!-- Balloons -->

    <div class="balloon b1"></div>
    <div class="balloon b2"></div>
    <div class="balloon b3"></div>
    <div class="balloon b4"></div>

    <!-- Fireworks -->

    <div class="firework fw1"></div>
    <div class="firework fw2"></div>
    <div class="firework fw3"></div>

    <div class="content">

        <h1 class="title">
            HAPPY BIRTHDAY
        </h1>

        <!-- Main Photo -->

        <div class="main-photo">
            <img src="birthday.jpg" alt="Birthday Photo">
        </div>

        <!-- Change Name -->

        <div class="name">
            🎉 YOUR NAME 🎉
        </div>

        <!-- Surprise -->

        <button class="surprise-btn" onclick="openSurprise()">
            🎁 CLICK FOR SURPRISE 🎁
        </button>

    </div>

</div>


<!-- =====================================================
     SECOND PAGE
     NO BACK BUTTON
===================================================== -->

<div id="surprisePage">

    <div class="stars"></div>
    <div class="stars2"></div>
    <div class="stars3"></div>

    <div class="firework fw1"></div>
    <div class="firework fw2"></div>
    <div class="firework fw3"></div>

    <h2 class="memory-title">
        ✨ SPECIAL MEMORIES ✨
    </h2>

    <div class="gallery">

        <!-- Photo 1 -->
        <div class="card" data-position="0">
            <div class="card-inner">
                <img src="birthday.jpg" alt="Memory 1">
            </div>
        </div>

        <!-- Photo 2 -->
        <div class="card" data-position="1">
            <div class="card-inner">
                <img src="photo2.jpg" alt="Memory 2">
            </div>
        </div>

        <!-- Photo 3 -->
        <div class="card" data-position="2">
            <div class="card-inner">
                <img src="photo3.jpg" alt="Memory 3">
            </div>
        </div>

        <!-- Photo 4 -->
        <div class="card" data-position="3">
            <div class="card-inner">
                <img src="photo4.jpg" alt="Memory 4">
            </div>
        </div>

        <!-- Photo 5 -->
        <div class="card" data-position="4">
            <div class="card-inner">
                <img src="photo5.jpg" alt="Memory 5">
            </div>
        </div>

    </div>

    <!-- ONLY NEXT BUTTON -->
    <button class="next-btn" onclick="nextPhotos()">
        ➜
    </button>

</div>


<script>

/* =====================================================
   OPEN SECOND PAGE
===================================================== */

function openSurprise() {

    const page = document.getElementById("surprisePage");

    page.style.display = "block";

    setTimeout(() => {
        page.classList.add("show");
    }, 50);

}


/* =====================================================
   PHOTO ROTATION
===================================================== */

function nextPhotos() {

    const cards = document.querySelectorAll(".card");

    cards.forEach(card => {

        let position = parseInt(
            card.getAttribute("data-position")
        );

        position++;

        if (position > 4) {
            position = 0;
        }

        card.setAttribute(
            "data-position",
            position
        );

    });

}


/* =====================================================
   AUTOMATIC PHOTO SLIDESHOW
===================================================== */

setInterval(() => {

    const page =
        document.getElementById("surprisePage");

    if (page.classList.contains("show")) {
        nextPhotos();
    }

}, 3500);


/* =====================================================
   CREATE EXTRA SPARKLES
===================================================== */

function createSparkles() {

    for (let i = 0; i < 35; i++) {

        const sparkle =
            document.createElement("div");

        sparkle.style.position = "fixed";
        sparkle.style.width = "3px";
        sparkle.style.height = "3px";
        sparkle.style.borderRadius = "50%";
        sparkle.style.background = "white";

        sparkle.style.left =
            Math.random() * 100 + "%";

        sparkle.style.top =
            Math.random() * 100 + "%";

        sparkle.style.boxShadow =
            "0 0 10px #fff, 0 0 20px #00ffff";

        sparkle.style.pointerEvents = "none";
        sparkle.style.zIndex = "2";

        sparkle.style.animation =
            `sparkleAnim ${2 + Math.random() * 4}s infinite`;

        document.body.appendChild(sparkle);
    }
}

const sparkleStyle =
document.createElement("style");

sparkleStyle.innerHTML = `
@keyframes sparkleAnim {

    0%,100% {
        opacity: .1;
        transform: scale(.5);
    }

    50% {
        opacity: 1;
        transform: scale(1.5);
    }

}
`;

document.head.appendChild(sparkleStyle);

createSparkles();

</script>

</body>
</html>
