<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>🎀 Happy Birthday 🎀</title>

<style>

/* =========================================================
   RESET
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    min-height: 100vh;
    overflow-x: hidden;

    font-family:
        "Trebuchet MS",
        Arial,
        sans-serif;

    background: rgb(7, 10, 22);

    color: white;
}


/* =========================================================
   MAIN PAGE
========================================================= */

#homePage,
#surprisePage {

    position: relative;

    min-height: 100vh;

    overflow: hidden;
}


/* =========================================================
   HOME BACKGROUND
========================================================= */

#homePage {

    background:

        radial-gradient(
            circle at 10% 15%,
            rgba(255, 0, 170, .28),
            transparent 30%
        ),

        radial-gradient(
            circle at 90% 20%,
            rgba(0, 220, 255, .28),
            transparent 32%
        ),

        radial-gradient(
            circle at 50% 90%,
            rgba(140, 0, 255, .28),
            transparent 38%
        ),

        rgb(15, 18, 35);
}


/* =========================================================
   STAR BACKGROUND
========================================================= */

.stars,
.stars2,
.stars3 {

    position: fixed;

    inset: 0;

    pointer-events: none;

    z-index: 1;
}

.stars {

    background-image:

        radial-gradient(
            2px 2px at 20px 30px,
            white,
            transparent
        ),

        radial-gradient(
            1px 1px at 100px 150px,
            white,
            transparent
        ),

        radial-gradient(
            2px 2px at 250px 100px,
            white,
            transparent
        ),

        radial-gradient(
            1px 1px at 350px 220px,
            white,
            transparent
        ),

        radial-gradient(
            2px 2px at 500px 50px,
            white,
            transparent
        );

    background-size: 550px 300px;

    animation:
        starsMove 30s linear infinite;

    opacity: .6;
}

.stars2 {

    background-image:

        radial-gradient(
            1px 1px at 50px 80px,
            #00ffff,
            transparent
        ),

        radial-gradient(
            2px 2px at 180px 200px,
            #ff00cc,
            transparent
        ),

        radial-gradient(
            1px 1px at 400px 140px,
            #ffd700,
            transparent
        );

    background-size: 600px 350px;

    animation:
        starsMove 45s linear infinite reverse;

    opacity: .55;
}

.stars3 {

    background-image:

        radial-gradient(
            2px 2px at 80px 180px,
            #ff69d4,
            transparent
        ),

        radial-gradient(
            1px 1px at 300px 50px,
            #00ffff,
            transparent
        );

    background-size: 700px 400px;

    animation:
        starsMove 60s linear infinite;

    opacity: .4;
}

@keyframes starsMove {

    from {
        transform: translateY(0);
    }

    to {
        transform: translateY(300px);
    }
}


/* =========================================================
   FLOATING TEDDIES
========================================================= */

.floatingTeddy {

    position: fixed;

    z-index: 5;

    font-size: 65px;

    pointer-events: none;

    filter:
        drop-shadow(0 0 10px #ff69d4)
        drop-shadow(0 0 25px #00ffff);

    animation:
        teddyFloat 4s ease-in-out infinite;
}

.teddy1 {
    left: 5%;
    top: 14%;
}

.teddy2 {
    right: 5%;
    top: 20%;
    animation-delay: 1s;
}

.teddy3 {
    left: 7%;
    bottom: 12%;
    animation-delay: 2s;
}

.teddy4 {
    right: 7%;
    bottom: 10%;
    animation-delay: 3s;
}

@keyframes teddyFloat {

    0%,100% {
        transform:
            translateY(0)
            rotate(-6deg)
            scale(1);
    }

    50% {
        transform:
            translateY(-25px)
            rotate(6deg)
            scale(1.08);
    }
}


/* =========================================================
   BALLOONS
========================================================= */

.balloon {

    position: fixed;

    z-index: 3;

    width: 55px;
    height: 70px;

    border-radius:
        50% 50% 45% 45%;

    opacity: .75;

    filter:
        drop-shadow(0 0 12px currentColor);

    animation:
        balloonFloat 5s ease-in-out infinite;
}

.balloon::after {

    content: "";

    position: absolute;

    width: 2px;

    height: 80px;

    background:
        rgba(255,255,255,.5);

    left: 50%;

    top: 65px;
}

.b1 {
    left: 15%;
    top: 8%;
    background: #ff1493;
    color: #ff1493;
}

.b2 {
    left: 80%;
    top: 12%;
    background: #00ffff;
    color: #00ffff;
    animation-delay: 1s;
}

.b3 {
    left: 8%;
    bottom: 30%;
    background: #9b59ff;
    color: #9b59ff;
    animation-delay: 2s;
}

.b4 {
    right: 12%;
    bottom: 25%;
    background: #ffd700;
    color: #ffd700;
    animation-delay: 3s;
}

@keyframes balloonFloat {

    0%,100% {
        transform:
            translateY(0)
            rotate(-5deg);
    }

    50% {
        transform:
            translateY(-30px)
            rotate(5deg);
    }
}


/* =========================================================
   FIREWORKS
========================================================= */

.firework {

    position: fixed;

    z-index: 2;

    width: 5px;
    height: 5px;

    border-radius: 50%;

    background: white;

    box-shadow:
        0 -70px 0 #ff00cc,
        0 70px 0 #00ffff,
        70px 0 0 #ffd700,
        -70px 0 0 #ff1493,
        50px 50px 0 #9b59ff,
        -50px -50px 0 #00ffff,
        50px -50px 0 #ffd700,
        -50px 50px 0 #ff69d4;

    animation:
        firework 3s ease-in-out infinite;
}

.fw1 {
    left: 20%;
    top: 25%;
}

.fw2 {
    right: 20%;
    top: 40%;
    animation-delay: 1s;
}

.fw3 {
    left: 50%;
    top: 12%;
    animation-delay: 2s;
}

@keyframes firework {

    0%,100% {
        transform: scale(.2);
        opacity: .2;
    }

    50% {
        transform: scale(1);
        opacity: .9;
    }
}


/* =========================================================
   HOME CONTENT
========================================================= */

.content {

    position: relative;

    z-index: 10;

    min-height: 100vh;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    text-align: center;

    padding:
        50px 20px;
}


/* =========================================================
   TOP TITLE
========================================================= */

.title {

    font-size:
        clamp(38px, 8vw, 90px);

    font-weight: 900;

    letter-spacing:
        clamp(3px, 1vw, 10px);

    color: transparent;

    background:

        linear-gradient(
            90deg,
            #ff00cc,
            #ffd700,
            #ffffff,
            #00ffff,
            #9b59ff,
            #ff00cc
        );

    background-size: 400% 100%;

    -webkit-background-clip: text;
    background-clip: text;

    animation:
        titleRGB 5s linear infinite,
        titleGlow 2s ease-in-out infinite alternate;

    text-shadow:
        0 0 20px rgba(255,0,204,.6);
}

@keyframes titleRGB {

    0% {
        background-position: 0%;
    }

    100% {
        background-position: 400%;
    }
}

@keyframes titleGlow {

    from {
        filter:
            drop-shadow(0 0 5px #ff00cc);
    }

    to {
        filter:
            drop-shadow(0 0 25px #00ffff)
            drop-shadow(0 0 35px #ff00cc);
    }
}


/* =========================================================
   MAIN PHOTO FRAME
========================================================= */

.photoFrame {

    position: relative;

    width:
        min(430px, 82vw);

    aspect-ratio: 4 / 5;

    margin: 30px auto;

    padding: 7px;

    border-radius: 35px;

    background:

        conic-gradient(
            from 0deg,
            #ff00cc,
            #ff1493,
            #ffd700,
            #00ffff,
            #008cff,
            #9b00ff,
            #ff00cc
        );

    background-size: 300% 300%;

    animation:
        frameRGB 5s linear infinite,
        frameBreath 3s ease-in-out infinite;

    box-shadow:
        0 0 20px #ff00cc,
        0 0 50px rgba(0,255,255,.45);

    overflow: visible;
}

@keyframes frameRGB {

    0% {
        background-position: 0% 50%;
    }

    50% {
        background-position: 100% 50%;
    }

    100% {
        background-position: 0% 50%;
    }
}

@keyframes frameBreath {

    0%,100% {

        transform: scale(1);

        box-shadow:
            0 0 20px #ff00cc,
            0 0 45px rgba(0,255,255,.35);
    }

    50% {

        transform: scale(1.035);

        box-shadow:
            0 0 30px #ff00cc,
            0 0 65px #00ffff,
            0 0 100px rgba(255,0,204,.45);
    }
}


/* =========================================================
   SAME PHOTO BACKGROUND
========================================================= */

.photoBackground {

    position: absolute;

    inset: 10px;

    overflow: hidden;

    border-radius: 27px;

    z-index: 1;
}

.photoBackground img {

    width: 100%;
    height: 100%;

    object-fit: cover;

    transform: scale(1.18);

    filter:
        blur(20px)
        saturate(1.7)
        brightness(.55);

    opacity: .75;

    animation:
        backgroundZoom 5s ease-in-out infinite alternate;
}

@keyframes backgroundZoom {

    from {
        transform: scale(1.18);
    }

    to {
        transform: scale(1.32);
    }
}


/* =========================================================
   FRONT PHOTO
========================================================= */

.photoInner {

    position: absolute;

    inset: 14px;

    overflow: hidden;

    border-radius: 24px;

    z-index: 5;

    border:
        2px solid rgba(255,255,255,.8);

    box-shadow:
        inset 0 0 30px rgba(0,0,0,.65),
        0 0 20px rgba(255,255,255,.25);
}

.photoInner img {

    width: 100%;
    height: 100%;

    object-fit: cover;

    display: block;

    animation:
        photoZoom 4s ease-in-out infinite alternate;

    transition:
        opacity .6s ease;
}

@keyframes photoZoom {

    from {
        transform: scale(1);
    }

    to {
        transform: scale(1.06);
    }
}


/* =========================================================
   PHOTO LIGHT SWEEP
========================================================= */

.photoSweep {

    position: absolute;

    top: -80%;

    left: -70%;

    width: 45%;

    height: 260%;

    z-index: 10;

    pointer-events: none;

    transform: rotate(25deg);

    background:

        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.05),
            rgba(255,255,255,.55),
            rgba(255,255,255,.05),
            transparent
        );

    animation:
        photoSweep 3.5s linear infinite;
}

@keyframes photoSweep {

    from {
        left: -80%;
    }

    to {
        left: 150%;
    }
}


/* =========================================================
   TEDDY ON PHOTO
========================================================= */

.photoTeddy {

    position: absolute;

    z-index: 20;

    right: -30px;

    bottom: -25px;

    font-size: 55px;

    filter:
        drop-shadow(0 0 10px #ff69d4)
        drop-shadow(0 0 20px #00ffff);

    animation:
        photoTeddy 2.5s ease-in-out infinite;
}

@keyframes photoTeddy {

    0%,100% {
        transform:
            rotate(-7deg)
            translateY(0);
    }

    50% {
        transform:
            rotate(7deg)
            translateY(-12px);
    }
}


/* =========================================================
   NAME
========================================================= */

.name {

    position: relative;

    margin-top: 10px;

    margin-bottom: 25px;

    font-family:
        "Trebuchet MS",
        "Arial Rounded MT Bold",
        Arial,
        sans-serif;

    font-size:
        clamp(30px, 6vw, 65px);

    font-weight: 900;

    letter-spacing:
        clamp(2px, 1vw, 8px);

    text-transform: uppercase;

    color: transparent;

    background:

        linear-gradient(
            90deg,
            #fff7ad,
            #ffd700,
            #ffffff,
            #ff69d4,
            #ffffff,
            #00ffff,
            #fff7ad
        );

    background-size: 300% 100%;

    -webkit-background-clip: text;
    background-clip: text;

    -webkit-text-fill-color: transparent;

    filter:
        drop-shadow(0 0 5px rgba(255,255,255,.8))
        drop-shadow(0 0 12px rgba(255,0,204,.9))
        drop-shadow(0 0 25px rgba(0,255,255,.7));

    animation:
        nameShine 4s linear infinite,
        nameFloat 3s ease-in-out infinite,
        nameGlow 2s ease-in-out infinite alternate;
}

@keyframes nameShine {

    from {
        background-position: 0%;
    }

    to {
        background-position: 300%;
    }
}

@keyframes nameFloat {

    0%,100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-8px);
    }
}

@keyframes nameGlow {

    from {
        filter:
            drop-shadow(0 0 5px #ff00cc);
    }

    to {
        filter:
            drop-shadow(0 0 12px #ff00cc)
            drop-shadow(0 0 25px #00ffff);
    }
}

.name::after {

    content: "";

    position: absolute;

    left: 10%;

    right: 10%;

    bottom: -12px;

    height: 3px;

    border-radius: 50%;

    background:

        linear-gradient(
            90deg,
            transparent,
            #ff00cc,
            #00ffff,
            #ffd700,
            #ff00cc,
            transparent
        );

    box-shadow:
        0 0 10px #ff00cc,
        0 0 20px #00ffff;

    animation:
        underlineGlow 2s ease-in-out infinite alternate;
}

@keyframes underlineGlow {

    from {
        opacity: .45;
        transform: scaleX(.75);
    }

    to {
        opacity: 1;
        transform: scaleX(1);
    }
}


/* =========================================================
   SURPRISE BUTTON
========================================================= */

.surpriseButton {

    position: relative;

    border: 2px solid transparent;

    border-radius: 50px;

    padding:
        16px 35px;

    font-size:
        clamp(16px, 3vw, 22px);

    font-weight: 900;

    color: white;

    cursor: pointer;

    background:

        linear-gradient(
            rgba(20,20,35,.9),
            rgba(20,20,35,.9)
        ) padding-box,

        linear-gradient(
            90deg,
            #ff00cc,
            #ffd700,
            #00ffff,
            #9b59ff,
            #ff00cc
        ) border-box;

    box-shadow:
        0 0 15px #ff00cc,
        0 0 30px rgba(0,255,255,.35);

    transition:
        transform .3s ease,
        box-shadow .3s ease;

    animation:
        buttonBreath 2s ease-in-out infinite;
}

.surpriseButton:hover {

    transform:
        translateY(-5px)
        scale(1.04);

    box-shadow:
        0 0 25px #ff00cc,
        0 0 50px #00ffff;
}

@keyframes buttonBreath {

    0%,100% {
        box-shadow:
            0 0 15px #ff00cc,
            0 0 30px rgba(0,255,255,.3);
    }

    50% {
        box-shadow:
            0 0 25px #ff00cc,
            0 0 45px #00ffff;
    }
}


/* =========================================================
   SURPRISE PAGE
========================================================= */

#surprisePage {

    display: none;

    background:

        radial-gradient(
            circle at 15% 20%,
            rgba(255,0,204,.25),
            transparent 30%
        ),

        radial-gradient(
            circle at 85% 20%,
            rgba(0,255,255,.25),
            transparent 32%
        ),

        radial-gradient(
            circle at 50% 90%,
            rgba(130,0,255,.25),
            transparent 40%
        ),

        rgb(8, 13, 27);

    padding:
        35px 20px 80px;
}


/* =========================================================
   MEMORIES OUTER FRAME
========================================================= */

.memoriesFrame {

    position: relative;

    width: min(1100px, 94vw);

    margin:
        0 auto 30px;

    padding:
        38px 28px 45px;

    border-radius: 38px;

    background:

        linear-gradient(
            135deg,
            rgba(255,0,204,.12),
            rgba(0,255,255,.10),
            rgba(255,215,0,.08)
        );

    border: 2px solid transparent;

    isolation: isolate;

    box-shadow:
        0 0 25px rgba(255,0,204,.35),
        0 0 60px rgba(0,255,255,.18);

    overflow: hidden;

    animation:
        memoriesBreath 4s ease-in-out infinite;
}


/* RGB border */

.memoriesFrame::before {

    content: "";

    position: absolute;

    inset: 0;

    border-radius: 38px;

    padding: 2px;

    background:

        linear-gradient(
            120deg,
            #ff00cc,
            #00ffff,
            #ffd700,
            #9b59ff,
            #ff00cc
        );

    background-size: 300% 300%;

    animation:
        memoriesRGB 5s linear infinite;

    -webkit-mask:
        linear-gradient(#fff 0 0) content-box,
        linear-gradient(#fff 0 0);

    -webkit-mask-composite: xor;

    mask-composite: exclude;

    pointer-events: none;

    z-index: 20;
}

@keyframes memoriesRGB {

    0% {
        background-position: 0% 50%;
    }

    50% {
        background-position: 100% 50%;
    }

    100% {
        background-position: 0% 50%;
    }
}

@keyframes memoriesBreath {

    0%,100% {

        transform: scale(1);

        box-shadow:
            0 0 25px rgba(255,0,204,.35),
            0 0 60px rgba(0,255,255,.18);
    }

    50% {

        transform: scale(1.012);

        box-shadow:
            0 0 35px rgba(255,0,204,.55),
            0 0 80px rgba(0,255,255,.3),
            0 0 120px rgba(155,89,255,.18);
    }
}


/* =========================================================
   MEMORIES GLOW
========================================================= */

.memoriesFrame::after {

    content: "";

    position: absolute;

    inset: -30px;

    background:

        conic-gradient(
            from 0deg,
            rgba(255,0,204,.18),
            rgba(0,255,255,.15),
            rgba(255,215,0,.12),
            rgba(155,89,255,.18),
            rgba(255,0,204,.18)
        );

    filter: blur(35px);

    opacity: .6;

    z-index: -2;

    animation:
        memoriesGlow 7s linear infinite;
}

@keyframes memoriesGlow {

    from {
        transform: rotate(0deg) scale(.9);
    }

    to {
        transform: rotate(360deg) scale(1.1);
    }
}


/* =========================================================
   MOVING LIGHT OVER MEMORIES
========================================================= */

.memoriesLight {

    position: absolute;

    top: -80%;

    left: -50%;

    width: 25%;

    height: 260%;

    background:

        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.06),
            rgba(255,255,255,.25),
            rgba(255,255,255,.06),
            transparent
        );

    transform: rotate(25deg);

    pointer-events: none;

    z-index: 15;

    animation:
        memoriesLightMove 5s linear infinite;
}

@keyframes memoriesLightMove {

    from {
        left: -50%;
    }

    to {
        left: 140%;
    }
}


/* =========================================================
   MEMORY TITLE BOX
========================================================= */

.memoryTitleBox {

    position: relative;

    width: min(820px, 95%);

    margin:
        0 auto 30px;

    padding:
        28px 25px 22px;

    text-align: center;

    border-radius: 24px;

    background:

        linear-gradient(
            135deg,
            rgba(255,0,204,.13),
            rgba(0,255,255,.10)
        );

    border:
        1px solid rgba(255,255,255,.22);

    box-shadow:
        inset 0 0 35px rgba(255,255,255,.04),
        0 0 25px rgba(255,0,204,.18);

    overflow: hidden;
}

.memoryTitle {

    position: relative;

    font-size:
        clamp(30px, 5vw, 58px);

    font-weight: 900;

    letter-spacing:
        clamp(2px, .7vw, 7px);

    color: transparent;

    background:

        linear-gradient(
            90deg,
            #ffd700,
            #ff69d4,
            #00ffff,
            #ffd700
        );

    background-size: 300% 100%;

    -webkit-background-clip: text;
    background-clip: text;

    animation:
        memoryTitleRGB 4s linear infinite,
        memoryTitleGlow 2s ease-in-out infinite alternate;

    text-shadow:
        0 0 15px rgba(255,0,204,.4);
}

@keyframes memoryTitleRGB {

    from {
        background-position: 0%;
    }

    to {
        background-position: 300%;
    }
}

@keyframes memoryTitleGlow {

    from {
        filter:
            drop-shadow(0 0 5px #ff00cc);
    }

    to {
        filter:
            drop-shadow(0 0 12px #00ffff)
            drop-shadow(0 0 20px #ff00cc);
    }
}

.memorySubtitle {

    margin-top: 15px;

    font-size:
        clamp(14px, 2vw, 20px);

    font-weight: 700;

    color: #ffffff;

    text-shadow:
        0 0 8px #ff00cc,
        0 0 15px #00ffff;
}

.memoryUnderline {

    width: 70%;

    height: 3px;

    margin:
        16px auto 10px;

    border-radius: 50%;

    background:

        linear-gradient(
            90deg,
            transparent,
            #ff00cc,
            #00ffff,
            #ffd700,
            #ff00cc,
            transparent
        );

    box-shadow:
        0 0 10px #ff00cc,
        0 0 20px #00ffff;

    animation:
        underlineBreath 2s ease-in-out infinite alternate;
}

@keyframes underlineBreath {

    from {
        transform: scaleX(.7);
        opacity: .5;
    }

    to {
        transform: scaleX(1);
        opacity: 1;
    }
}

.memoryTeddy {

    margin-top: 12px;

    font-size: 30px;

    letter-spacing: 10px;

    filter:
        drop-shadow(0 0 8px #ff69d4);

    animation:
        titleTeddy 2s ease-in-out infinite;
}

@keyframes titleTeddy {

    0%,100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-6px);
    }
}


/* =========================================================
   CORNER TEDDIES
========================================================= */

.memoryCornerTeddy {

    position: absolute;

    z-index: 30;

    font-size: 48px;

    filter:
        drop-shadow(0 0 10px #ff69d4)
        drop-shadow(0 0 20px #00ffff);

    animation:
        cornerTeddy 3s ease-in-out infinite;
}

.memoryCornerTeddy.left {

    left: 20px;

    top: 15px;
}

.memoryCornerTeddy.right {

    right: 20px;

    top: 15px;

    animation-delay: 1.5s;
}

@keyframes cornerTeddy {

    0%,100% {
        transform:
            translateY(0)
            rotate(-5deg);
    }

    50% {
        transform:
            translateY(-10px)
            rotate(5deg);
    }
}


/* =========================================================
   ONE MEMORY AREA
========================================================= */

.singleMemoryArea {

    position: relative;

    width: 100%;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    padding:
        5px 0 10px;
}


/* =========================================================
   SINGLE MEMORY FRAME
========================================================= */

.singleMemoryFrame {

    position: relative;

    width:
        min(470px, 78vw);

    aspect-ratio: 4 / 5;

    padding: 7px;

    border-radius: 34px;

    background:

        conic-gradient(
            from 0deg,
            #ff00cc,
            #ff1493,
            #ffd700,
            #00ffff,
            #008cff,
            #9b00ff,
            #ff00cc
        );

    background-size: 300% 300%;

    animation:
        singleFrameRGB 5s linear infinite,
        singleFrameBreath 3s ease-in-out infinite;

    box-shadow:
        0 0 20px #ff00cc,
        0 0 45px rgba(0,255,255,.45);

    isolation: isolate;

    overflow: visible;

    transition:
        transform .7s ease,
        opacity .7s ease;
}


/* =========================================================
   FRAME RGB
========================================================= */

@keyframes singleFrameRGB {

    0% {
        background-position: 0% 50%;
    }

    25% {
        background-position: 100% 50%;
    }

    50% {
        background-position: 100% 100%;
    }

    75% {
        background-position: 0% 100%;
    }

    100% {
        background-position: 0% 50%;
    }
}


/* =========================================================
   FRAME BREATHING
========================================================= */

@keyframes singleFrameBreath {

    0%,100% {

        transform: scale(1);

        box-shadow:
            0 0 18px #ff00cc,
            0 0 40px rgba(255,0,204,.4),
            0 0 65px rgba(0,255,255,.2);
    }

    50% {

        transform: scale(1.035);

        box-shadow:
            0 0 30px #ff00cc,
            0 0 55px rgba(255,0,204,.8),
            0 0 90px rgba(0,255,255,.6),
            0 0 120px rgba(255,215,0,.25);
    }
}


/* =========================================================
   FRAME OUTER GLOW
========================================================= */

.singleMemoryGlow {

    position: absolute;

    inset: -20px;

    border-radius: 45px;

    background:

        conic-gradient(
            from 0deg,
            #ff00cc,
            #00ffff,
            #ffd700,
            #9b00ff,
            #ff00cc
        );

    background-size: 300% 300%;

    filter: blur(25px);

    opacity: .35;

    z-index: -2;

    animation:
        singleFrameRGB 5s linear infinite,
        memoryGlowBreath 3s ease-in-out infinite;
}

@keyframes memoryGlowBreath {

    0%,100% {
        transform: scale(.92);
        opacity: .2;
    }

    50% {
        transform: scale(1.12);
        opacity: .65;
    }
}


/* =========================================================
   FRAME LIGHT
========================================================= */

.singleMemoryLight {

    position: absolute;

    top: -80%;

    left: -80%;

    width: 45%;

    height: 260%;

    background:

        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.10),
            rgba(255,255,255,.65),
            rgba(255,255,255,.10),
            transparent
        );

    transform: rotate(25deg);

    z-index: 10;

    pointer-events: none;

    animation:
        singleMemoryLightMove 3.2s linear infinite;
}

@keyframes singleMemoryLightMove {

    0% {
        left: -80%;
    }

    100% {
        left: 140%;
    }
}


/* =========================================================
   SINGLE PHOTO
========================================================= */

.singleMemoryPhoto {

    position: absolute;

    inset: 13px;

    border-radius: 25px;

    overflow: hidden;

    background:
        rgb(10,12,22);

    border:
        2px solid rgba(255,255,255,.8);

    z-index: 5;

    box-shadow:
        inset 0 0 35px rgba(0,0,0,.75),
        0 0 20px rgba(255,255,255,.2);
}

.singleMemoryPhoto::after {

    content: "";

    position: absolute;

    inset: 0;

    background:

        linear-gradient(
            135deg,
            rgba(255,255,255,.12),
            transparent 30%,
            transparent 70%,
            rgba(255,0,204,.08)
        );

    pointer-events: none;

    z-index: 3;
}

.singleMemoryPhoto img {

    width: 100%;
    height: 100%;

    display: block;

    object-fit: cover;

    animation:
        memoryPhotoZoom 4s ease-in-out infinite alternate;

    transition:
        opacity .4s ease,
        transform .8s ease;
}

@keyframes memoryPhotoZoom {

    from {
        transform: scale(1);
    }

    to {
        transform: scale(1.07);
    }
}


/* =========================================================
   SLIDE OUT / IN
========================================================= */

.singleMemoryFrame.memorySlideOut {

    animation:
        memorySlideOut .65s ease forwards;
}

.singleMemoryFrame.memorySlideIn {

    animation:
        memorySlideIn .75s ease forwards;
}

@keyframes memorySlideOut {

    0% {
        opacity: 1;
        transform:
            translateX(0)
            scale(1);
    }

    100% {
        opacity: 0;
        transform:
            translateX(-130px)
            scale(.92);
    }
}

@keyframes memorySlideIn {

    0% {
        opacity: 0;
        transform:
            translateX(130px)
            scale(.92);
    }

    100% {
        opacity: 1;
        transform:
            translateX(0)
            scale(1);
    }
}


/* =========================================================
   FRAME CORNER GRAPHICS
========================================================= */

.memoryCorner {

    position: absolute;

    width: 42px;

    height: 42px;

    z-index: 15;

    border:
        4px solid white;

    filter:
        drop-shadow(0 0 8px #00ffff)
        drop-shadow(0 0 14px #ff00cc);

    animation:
        memoryCornerGlow 1.5s ease-in-out infinite alternate;
}

.memoryCorner.topLeft {

    left: -5px;
    top: -5px;

    border-right: 0;
    border-bottom: 0;

    border-radius:
        25px 0 0 0;
}

.memoryCorner.topRight {

    right: -5px;
    top: -5px;

    border-left: 0;
    border-bottom: 0;

    border-radius:
        0 25px 0 0;
}

.memoryCorner.bottomLeft {

    left: -5px;
    bottom: -5px;

    border-right: 0;
    border-top: 0;

    border-radius:
        0 0 0 25px;
}

.memoryCorner.bottomRight {

    right: -5px;
    bottom: -5px;

    border-left: 0;
    border-top: 0;

    border-radius:
        0 0 25px 0;
}

@keyframes memoryCornerGlow {

    from {
        opacity: .45;
        transform: scale(.9);
    }

    to {
        opacity: 1;
        transform: scale(1.1);
    }
}


/* =========================================================
   TEDDY ON SINGLE FRAME
========================================================= */

.singleFrameTeddy {

    position: absolute;

    right: -38px;

    bottom: -30px;

    z-index: 30;

    font-size: 58px;

    filter:
        drop-shadow(0 0 8px #ff69d4)
        drop-shadow(0 0 20px #00ffff);

    animation:
        singleTeddyFloat 2.5s ease-in-out infinite;
}

@keyframes singleTeddyFloat {

    0%,100% {
        transform:
            rotate(-7deg)
            translateY(0);
    }

    50% {
        transform:
            rotate(7deg)
            translateY(-12px);
    }
}


/* =========================================================
   HEART
========================================================= */

.singleFrameHeart {

    position: absolute;

    left: -38px;

    top: 45%;

    z-index: 30;

    font-size: 45px;

    filter:
        drop-shadow(0 0 8px #ff00cc)
        drop-shadow(0 0 15px #ff69d4);

    animation:
        singleHeartFloat 2s ease-in-out infinite;
}

@keyframes singleHeartFloat {

    0%,100% {
        transform:
            scale(1)
            translateY(0);
    }

    50% {
        transform:
            scale(1.2)
            translateY(-10px);
    }
}


/* =========================================================
   MEMORY NUMBER
========================================================= */

.memoryNumber {

    margin-top: 25px;

    padding:
        9px 25px;

    border-radius: 30px;

    font-size: 18px;

    font-weight: 900;

    letter-spacing: 3px;

    color: white;

    background:

        linear-gradient(
            90deg,
            rgba(255,0,204,.25),
            rgba(0,255,255,.25),
            rgba(255,215,0,.25)
        );

    border:
        1px solid rgba(255,255,255,.5);

    box-shadow:
        0 0 12px #ff00cc,
        0 0 22px rgba(0,255,255,.4);

    text-shadow:
        0 0 8px #ff00cc,
        0 0 12px #00ffff;
}


/* =========================================================
   MEMORY DOTS
========================================================= */

.memoryDots {

    display: flex;

    gap: 11px;

    margin-top: 16px;

    justify-content: center;
}

.memoryDot {

    width: 11px;
    height: 11px;

    border-radius: 50%;

    background:
        rgba(255,255,255,.25);

    border:
        1px solid rgba(255,255,255,.5);

    cursor: pointer;

    transition:
        .3s ease;
}

.memoryDot.active {

    background: #ff00cc;

    transform:
        scale(1.5);

    box-shadow:
        0 0 8px #ff00cc,
        0 0 16px #00ffff;
}


/* =========================================================
   BACK BUTTON
========================================================= */

.backButton {

    display: block;

    margin:
        10px auto 0;

    padding:
        15px 32px;

    border-radius: 40px;

    border:
        2px solid transparent;

    color: white;

    font-size: 17px;

    font-weight: 900;

    cursor: pointer;

    background:

        linear-gradient(
            rgba(30,30,40,.9),
            rgba(30,30,40,.9)
        ) padding-box,

        linear-gradient(
            90deg,
            #00ffff,
            #ff00cc,
            #ffd700,
            #00ffff
        ) border-box;

    box-shadow:
        0 0 15px #00ffff,
        0 0 30px rgba(255,0,204,.35);

    transition:
        transform .3s ease;
}

.backButton:hover {

    transform:
        scale(1.06)
        translateY(-3px);

    box-shadow:
        0 0 25px #00ffff,
        0 0 45px #ff00cc;
}


/* =========================================================
   SPARKLES
========================================================= */

.sparkle {

    position: fixed;

    z-index: 50;

    pointer-events: none;

    font-size: 18px;

    animation:
        sparkleFloat 1.8s ease-out forwards;
}

@keyframes sparkleFloat {

    0% {
        opacity: 0;
        transform:
            translateY(20px)
            scale(.3)
            rotate(0deg);
    }

    20% {
        opacity: 1;
    }

    100% {
        opacity: 0;
        transform:
            translateY(-100px)
            scale(1.2)
            rotate(180deg);
    }
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 700px) {

    .floatingTeddy {

        font-size: 42px;
    }

    .balloon {

        transform: scale(.7);
    }

    .content {

        padding:
            40px 15px;
    }

    .photoFrame {

        width: 78vw;

        margin:
            25px auto;
    }

    .photoTeddy {

        right: -24px;

        bottom: -20px;

        font-size: 40px;
    }

    .memoriesFrame {

        width: 94vw;

        padding:
            30px 10px 35px;

        border-radius: 28px;
    }

    .memoryTitleBox {

        padding:
            22px 12px 18px;
    }

    .memoryCornerTeddy {

        font-size: 34px;
    }

    .memoryCornerTeddy.left {

        left: 8px;
    }

    .memoryCornerTeddy.right {

        right: 8px;
    }

    .singleMemoryFrame {

        width: 78vw;

        border-radius: 27px;
    }

    .singleMemoryPhoto {

        inset: 11px;

        border-radius: 21px;
    }

    .singleFrameTeddy {

        right: -25px;

        bottom: -22px;

        font-size: 42px;
    }

    .singleFrameHeart {

        left: -25px;

        font-size: 32px;
    }

    .memoryNumber {

        font-size: 14px;

        letter-spacing: 2px;
    }
}


@media (max-width: 420px) {

    .title {

        font-size: 35px;

        letter-spacing: 2px;
    }

    .name {

        font-size: 30px;
    }

    .photoFrame {

        width: 80vw;
    }

    .singleMemoryFrame {

        width: 80vw;
    }

    .memoryTeddy {

        font-size: 23px;

        letter-spacing: 4px;
    }

    .memoryCornerTeddy {

        font-size: 28px;
    }
}

</style>
</head>


<body>


<!-- =========================================================
     HOME PAGE
========================================================= -->

<section id="homePage">

    <!-- Stars -->

    <div class="stars"></div>
    <div class="stars2"></div>
    <div class="stars3"></div>


    <!-- Teddy decorations -->

    <div class="floatingTeddy teddy1">🧸</div>
    <div class="floatingTeddy teddy2">🧸</div>
    <div class="floatingTeddy teddy3">🧸</div>
    <div class="floatingTeddy teddy4">🧸</div>


    <!-- Balloons -->

    <div class="balloon b1"></div>
    <div class="balloon b2"></div>
    <div class="balloon b3"></div>
    <div class="balloon b4"></div>


    <!-- Fireworks -->

    <div class="firework fw1"></div>

    <div class="firework fw3"></div>


    <!-- Main -->

    <div class="content">

        <div class="title">

        </div>


        <!-- MAIN PHOTO -->

        <div class="photoFrame">

            <!-- Same image blurred in background -->

            <div class="photoBackground">

                <img
                    id="mainBackgroundPhoto"
                    src="birthday.jpg"

                >

            </div>


            <!-- Front image -->

            <div class="photoInner">

                    id="mainPhoto"
                    src="birthday.jpg"
                    alt="Birthday Photo"

            </div>

        >
            🧸 🎁 CLICK FOR SURPRISE 🎁 🧸
        </button>

</section>



<!-- =========================================================
     SURPRISE / MEMORIES PAGE
========================================================= -->

<section id="surprisePage">


    <div class="stars"></div>
    <div class="stars2"></div>
    <div class="stars3"></div>


    <!-- Floating teddies -->

    <div class="floatingTeddy teddy1">🧸</div>
    <div class="floatingTeddy teddy2">🧸</div>
    <div class="floatingTeddy teddy3">🧸</div>
    <div class="floatingTeddy teddy4">🧸</div>


    <!-- =====================================================
         MEMORIES
    ====================================================== -->

    <div class="memoriesFrame">

        <div class="memoriesLight"></div>


        <!-- Corner Teddy -->

        <div class="memoryCornerTeddy left">
            🧸
        </div>

        <div class="memoryCornerTeddy right">
            🧸
        </div>


        <!-- TITLE -->

        <div class="memoryTitleBox">

            <div class="memoryTitle">
                ✨ SPECIAL MEMORIES ✨
            </div>

            <div class="memorySubtitle">
                💗 Beautiful moments to remember forever 💗
            </div>

            <div class="memoryUnderline"></div>

            <div class="memoryTeddy">
                🧸 💖 🎀 💖 🧸
            </div>

        </div>


        <!-- =================================================
             ONE PHOTO AT A TIME
        ================================================== -->

        <div class="singleMemoryArea">


            <div
                class="singleMemoryFrame"
                id="singleMemoryFrame"
            >


                <!-- Glow -->

                <div class="singleMemoryGlow"></div>


                <!-- Moving light -->

                <div class="singleMemoryLight"></div>


                <!-- Frame corners -->

                <div class="memoryCorner topLeft"></div>

                <div class="memoryCorner topRight"></div>

                <div class="memoryCorner bottomLeft"></div>

                <div class="memoryCorner bottomRight"></div>


                <!-- PHOTO -->

                <div class="singleMemoryPhoto">

                    <img
                        id="memoryPhoto"
                        src="birthday.jpg"
                        alt="Memory 1"
                    >

                </div>


                <!-- Teddy -->

                <div class="singleFrameTeddy">
                    🧸
                </div>


                <!-- Heart -->

                <div class="singleFrameHeart">
                    💖
                </div>

            </div>


            <!-- MEMORY NUMBER -->

            <div
                class="memoryNumber"
                id="memoryNumber"
            >
                MEMORY 1
            </div>


            <!-- DOTS -->

            <div
                class="memoryDots"
                id="memoryDots"
            >

                <span
                    class="memoryDot active"
                    data-index="0"
                ></span>

                <span
                    class="memoryDot"
                    data-index="1"
                ></span>

                <span
                    class="memoryDot"
                    data-index="2"
                ></span>

                <span
                    class="memoryDot"
                    data-index="3"
                ></span>

                <span
                    class="memoryDot"
                    data-index="4"
                ></span>

            </div>

        </div>

    </div>


    <!-- BACK BUTTON -->

    <button
        class="backButton"
        onclick="goHome()"
    >
        🧸 💕 BACK TO BIRTHDAY 💕 🧸
    </button>


</section>



<script>

/* =========================================================
   PHOTO LIST
========================================================= */

const photos = [

    "birthday.jpg",
    "photo2.jpg",
    "photo3.jpg",
    "photo4.jpg",
    "photo5.jpg"

];


/* =========================================================
   MAIN PHOTO SLIDESHOW
========================================================= */

let mainPhotoIndex = 0;

const mainPhoto =
    document.getElementById("mainPhoto");

const mainBackgroundPhoto =
    document.getElementById(
        "mainBackgroundPhoto"
    );


function changeMainPhoto() {

    mainPhotoIndex++;

    if (
        mainPhotoIndex >= photos.length
    ) {

        mainPhotoIndex = 0;

    }


    /*
       Fade effect
    */

    mainPhoto.style.opacity = "0";

    mainBackgroundPhoto.style.opacity = "0";


    setTimeout(() => {

        mainPhoto.src =
            photos[mainPhotoIndex];

        mainBackgroundPhoto.src =
            photos[mainPhotoIndex];


        mainPhoto.style.opacity = "1";

        mainBackgroundPhoto.style.opacity = "1";

    }, 350);

}


/* Every 3.5 seconds */

setInterval(
    changeMainPhoto,
    3500
);



/* =========================================================
   PRELOAD ALL PHOTOS
========================================================= */

photos.forEach(
    (photo) => {

        const img =
            new Image();

        img.src = photo;

    }
);



/* =========================================================
   OPEN SURPRISE
========================================================= */

function openSurprise() {

    const home =
        document.getElementById(
            "homePage"
        );

    const surprise =
        document.getElementById(
            "surprisePage"
        );


    home.style.display =
        "none";

    surprise.style.display =
        "block";


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });


    createSparkleBurst();

}



/* =========================================================
   BACK TO HOME
========================================================= */

function goHome() {

    const home =
        document.getElementById(
            "homePage"
        );

    const surprise =
        document.getElementById(
            "surprisePage"
        );


    surprise.style.display =
        "none";

    home.style.display =
        "block";


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}



/* =========================================================
   SPECIAL MEMORY SLIDESHOW
========================================================= */

const memoryPhotos = [

    "birthday.jpg",
    "photo2.jpg",
    "photo3.jpg",
    "photo4.jpg",
    "photo5.jpg"

];


let memoryIndex = 0;


const memoryPhoto =
    document.getElementById(
        "memoryPhoto"
    );


const singleMemoryFrame =
    document.getElementById(
        "singleMemoryFrame"
    );


const memoryNumber =
    document.getElementById(
        "memoryNumber"
    );


const memoryDots =
    document.querySelectorAll(
        ".memoryDot"
    );



/* =========================================================
   UPDATE MEMORY
========================================================= */

function updateMemory() {

    /*
       Slide OUT
    */

    singleMemoryFrame.classList.remove(
        "memorySlideIn"
    );

    singleMemoryFrame.classList.add(
        "memorySlideOut"
    );


    setTimeout(() => {


        /*
           Next image
        */

        memoryIndex++;


        if (
            memoryIndex >=
            memoryPhotos.length
        ) {

            memoryIndex = 0;

        }


        /*
           Change image
        */

        memoryPhoto.src =
            memoryPhotos[
                memoryIndex
            ];


        /*
           Change number
        */

        memoryNumber.textContent =
            "MEMORY " +
            (memoryIndex + 1);


        /*
           Update dots
        */

        memoryDots.forEach(
            (dot, index) => {

                dot.classList.toggle(
                    "active",
                    index === memoryIndex
                );

            }
        );


        /*
           Remove old animation
        */

        singleMemoryFrame.classList.remove(
            "memorySlideOut"
        );


        /*
           Restart animation
        */

        void singleMemoryFrame.offsetWidth;


        /*
           Slide IN
        */

        singleMemoryFrame.classList.add(
            "memorySlideIn"
        );


    }, 650);


    /*
       Remove animation class
    */

    setTimeout(() => {

        singleMemoryFrame.classList.remove(
            "memorySlideIn"
        );

    }, 1450);

}



/* =========================================================
   AUTO MEMORY CHANGE
========================================================= */

setInterval(
    updateMemory,
    4000
);



/* =========================================================
   MEMORY DOT CLICK
========================================================= */

memoryDots.forEach(
    (dot, index) => {

        dot.addEventListener(
            "click",
            () => {


                if (
                    index === memoryIndex
                ) {

                    return;

                }


                /*
                   Set previous index
                   so updateMemory()
                   moves to selected image
                */

                memoryIndex =
                    index - 1;


                if (
                    memoryIndex < 0
                ) {

                    memoryIndex =
                        memoryPhotos.length - 1;

                }


                updateMemory();

            }
        );

    }
);



/* =========================================================
   PRELOAD MEMORY PHOTOS
========================================================= */

memoryPhotos.forEach(
    (photo) => {

        const img =
            new Image();

        img.src = photo;

    }
);



/* =========================================================
   SPARKLE EFFECT
========================================================= */

function createSparkle() {

    const sparkle =
        document.createElement(
            "div"
        );


    sparkle.className =
        "sparkle";


    const symbols = [

        "✨",
        "💖",
        "💗",
        "⭐",
        "💕",
        "🎀",
        "🧸"

    ];


    sparkle.textContent =
        symbols[
            Math.floor(
                Math.random() *
                symbols.length
            )
        ];


    sparkle.style.left =
        Math.random() * 100 +
        "vw";


    sparkle.style.top =
        (60 +
        Math.random() * 35) +
        "vh";


    document.body.appendChild(
        sparkle
    );


    setTimeout(() => {

        sparkle.remove();

    }, 1800);

}


/* Continuous sparkles */

setInterval(
    createSparkle,
    500
);



/* =========================================================
   SPARKLE BURST
========================================================= */

function createSparkleBurst() {

    for (
        let i = 0;
        i < 25;
        i++
    ) {

        setTimeout(
            createSparkle,
            i * 70
        );

    }

}



/* =========================================================
   CLICK ANYWHERE = SPARKLE BURST
========================================================= */

document.addEventListener(
    "click",
    function(event) {

        for (
            let i = 0;
            i < 6;
            i++
        ) {

            const sparkle =
                document.createElement(
                    "div"
                );


            sparkle.className =
                "sparkle";


            sparkle.textContent =
                "✨";


            sparkle.style.left =
                event.clientX +
                (Math.random() * 80 - 40) +
                "px";


            sparkle.style.top =
                event.clientY +
                (Math.random() * 80 - 40) +
                "px";


            document.body.appendChild(
                sparkle
            );


            setTimeout(() => {

                sparkle.remove();

            }, 1800);

        }

    }
);

</script>

</body>
</html>
